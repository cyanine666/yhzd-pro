<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远寒之地</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #b8b8b8;
    font-family: "Courier New", "宋体", monospace;
    font-size: 15px;
    line-height: 1.7;
    padding: 20px;
    min-height: 100vh;
  }
  #app { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 18px;
    font-weight: normal;
    letter-spacing: 4px;
    color: #6a6a6a;
    margin-bottom: 4px;
  }
  #toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0;
    padding-bottom: 14px;
    border-bottom: 1px solid #222;
  }
  button {
    background: #141414;
    color: #999;
    border: 1px solid #2a2a2a;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: .15s;
  }
  button:hover:not(:disabled) { background: #1e1e1e; color: #ddd; border-color: #3a3a3a; }
  button:disabled { opacity: .3; cursor: not-allowed; }
  #log {
    height: 300px;
    overflow-y: auto;
    padding: 12px;
    background: #060606;
    border: 1px solid #1a1a1a;
    margin-bottom: 14px;
    scrollbar-width: thin;
  }
  #log p { margin-bottom: 6px; animation: fade .4s; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .dim { color: #555; }
  .warn { color: #a06a3a; }
  .good { color: #5a8a5a; }
  #resourcebar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 10px 12px;
    background: #0e0e0e;
    border: 1px solid #1a1a1a;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .res { color: #777; }
  .res b { color: #b0b0b0; font-weight: normal; }
  #actions { display: flex; flex-direction: column; gap: 6px; }
  .action-row { display: flex; align-items: center; gap: 10px; }
  .action-row button { flex: 1; text-align: left; }
  .hint { font-size: 12px; color: #444; }
  #bars { margin-bottom: 14px; font-size: 13px; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bar span { width: 60px; color: #666; }
  .track { flex: 1; height: 6px; background: #151515; border: 1px solid #222; }
  .fill { height: 100%; transition: width .3s; }
  #saveMsg { font-size: 12px; color: #5a8a5a; height: 16px; }
</style>
</head>
<body>
<div id="app">
  <h1>远 寒 之 地</h1>

  <div id="toolbar">
    <button onclick="saveGame()">保存进度</button>
    <button onclick="loadGame()">读取存档</button>
    <button onclick="exportSave()">导出存档</button>
    <button onclick="importSave()">导入存档</button>
    <button onclick="resetGame()">重新开始</button>
  </div>
  <div id="saveMsg"></div>

  <div id="bars"></div>
  <div id="resourcebar"></div>
  <div id="log"></div>
  <div id="actions"></div>
</div>

<script>
const SAVE_KEY = "yuanhan_save_v1";
const AUTOSAVE_MS = 15000;

const state = {
  tick: 0,
  fire: 0,          // 火堆燃料
  wood: 0,
  fur: 0,
  meat: 0,
  stone: 0,
  metal: 0,
  pop: 0,
  maxPop: 2,
  huts: 0,
  traps: 0,
  fireUnlocked: false,
  gatherUnlocked: false,
  huntUnlocked: false,
  gatherJobs: 0,
  huntJobs: 0,
  explored: 0,
  log: []
};

// ---------- 日志 ----------
function log(msg, cls) {
  state.log.push({ m: msg, c: cls || "" });
  if (state.log.length > 200) state.log.shift();
  renderLog();
}
function renderLog() {
  const el = document.getElementById("log");
  el.innerHTML = state.log
    .map(l => `<p class="${l.c}">${l.m}</p>`)
    .join("");
  el.scrollTop = el.scrollHeight;
}

// ---------- 渲染 ----------
function renderBars() {
  const firePct = Math.min(100, state.fire / 2); // 200 为满
  const pct = Math.min(100, state.pop / state.maxPop * 100);
  document.getElementById("bars").innerHTML = `
    <div class="bar">
      <span>火堆</span>
      <div class="track"><div class="fill" style="width:${firePct}%;background:#c8792a"></div></div>
    </div>
    <div class="bar">
      <span>人口</span>
      <div class="track"><div class="fill" style="width:${pct}%;background:#5a8a5a"></div></div>
    </div>
  `;
}

function renderResources() {
  const items = [
    ["木材", state.wood],
    ["毛皮", state.fur],
    ["食物", state.meat],
    ["石头", state.stone],
    ["金属", state.metal],
  ];
  document.getElementById("resourcebar").innerHTML = items
    .map(([k, v]) => `<div class="res">${k} <b>${Math.floor(v)}</b></div>`)
    .join("");
}

function renderActions() {
  const el = document.getElementById("actions");
  const rows = [];

  // 1. 生火
  if (!state.fireUnlocked) {
    rows.push(`<div class="action-row">
      <button onclick="lightFire()">点火</button>
      <span class="hint">黑暗中，你摸到了一根火柴。</span>
    </div>`);
  } else {
    rows.push(`<div class="action-row">
      <button onclick="addWood()" ${state.wood < 1 ? "disabled" : ""}>添柴（消耗木材 x1）</button>
    </div>`);
  }

  // 2. 采集
  if (state.fireUnlocked) {
    if (!state.gatherUnlocked) {
      rows.push(`<div class="action-row">
        <button onclick="unlockGather()">走向森林</button>
      </div>`);
    } else {
      rows.push(`<div class="action-row">
        <button onclick="gather()">采集木材</button>
        <span class="hint">你还在自己动手。</span>
      </div>`);
    }
  }

  // 3. 狩猎
  if (state.gatherUnlocked && !state.huntUnlocked) {
    rows.push(`<div class="action-row">
      <button onclick="unlockHunt()">循着兽迹</button>
    </div>`);
  } else if (state.huntUnlocked) {
    rows.push(`<div class="action-row">
      <button onclick="hunt()">打猎</button>
      <span class="hint">毛皮与食物。</span>
    </div>`);
  }

  // 4. 建造小屋（提升人口上限）
  if (state.huntUnlocked) {
    const cost = 30;
    rows.push(`<div class="action-row">
      <button onclick="buildHut()" ${state.wood < cost ? "disabled" : ""}>
        建造小屋（木材 x${cost}）
      </button>
      <span class="hint">已建：${state.huts}</span>
    </div>`);
  }

  // 5. 招人
  if (state.huts > 0) {
    rows.push(`<div class="action-row">
      <button onclick="recruit()" ${state.wood < 10 ? "disabled" : ""}>
        招募村民（木材 x10）
      </button>
      <span class="hint">${state.pop}/${state.maxPop}</span>
    </div>`);
  }

  // 6. 自动化分配
  if (state.pop > 0) {
    rows.push(`<div class="action-row">
      <button onclick="assignGather()" ${state.gatherJobs >= state.pop ? "disabled" : ""}>
        派人采集（当前 ${state.gatherJobs}）
      </button>
      <button onclick="assignHunt()" ${state.huntJobs >= state.pop - state.gatherJobs ? "disabled" : ""}>
        派人狩猎（当前 ${state.huntJobs}）
      </button>
    </div>`);
  }

  // 7. 探索
  if (state.pop >= 2) {
    rows.push(`<div class="action-row">
      <button onclick="explore()">探索远方（消耗食物 x5）</button>
      <span class="hint">已探索：${state.explored}</span>
    </div>`);
  }

  el.innerHTML = rows.join("");
}

function render() {
  renderBars();
  renderResources();
  renderActions();
}

// ---------- 玩法 ----------
function lightFire() {
  state.fireUnlocked = true;
  state.fire = 60;
  log("火柴划亮了。火苗舔舐着干柴，黑暗退开了几步。", "warn");
  log("你感到一丝久违的暖意。", "dim");
  render();
}

function addWood() {
  state.wood -= 1;
  state.fire = Math.min(200, state.fire + 25);
  log("木头被填入火堆，火焰稍稍旺盛了些。", "dim");
  render();
}

function unlockGather() {
  state.gatherUnlocked = true;
  log("你推开木屋的门，冷风灌了进来。森林在远处沉默着。", "warn");
  render();
}

function gather() {
  const n = 1 + Math.floor(Math.random() * 3);
  state.wood += n;
  log(`你在林间收集到 ${n} 份木材。`, "good");
  render();
}

function unlockHunt() {
  state.huntUnlocked = true;
  log("雪地上有痕迹。也许是兔子，也许是别的什么。", "warn");
  render();
}

function hunt() {
  if (Math.random() < 0.65) {
    const fur = 1 + Math.floor(Math.random() * 2);
    const meat = 1 + Math.floor(Math.random() * 3);
    state.fur += fur;
    state.meat += meat;
    log(`你带回 ${fur} 张毛皮、${meat} 份食物。`, "good");
  } else {
    log("你在雪地里绕了很久，一无所获。", "dim");
  }
  render();
}

function buildHut() {
  state.wood -= 30;
  state.huts += 1;
  state.maxPop += 1;
  log(`一座新的小屋立起来了。可以容纳更多人。（人口上限 ${state.maxPop}）`, "good");
  render();
}

function recruit() {
  if (state.pop >= state.maxPop) {
    log("没有空余的床位了。", "dim");
    return;
  }
  state.wood -= 10;
  state.pop += 1;
  log(`一个流浪者加入了营地。现在有 ${state.pop} 人。`, "good");
  render();
}

function assignGather() {
  if (state.gatherJobs >= state.pop) return;
  state.gatherJobs++;
  log(`有人去采集了。（采集 ${state.gatherJobs} 人）`, "dim");
  render();
}

function assignHunt() {
  if (state.huntJobs >= state.pop - state.gatherJobs) return;
  state.huntJobs++;
  log(`有人去打猎了。（狩猎 ${state.huntJobs} 人）`, "dim");
  render();
}

function explore() {
  if (state.meat < 5) { log("食物不够，走不出多远。", "warn"); return; }
  state.meat -= 5;
  state.explored++;
  const found = [];
  if (Math.random() < 0.5) { const s = 2 + Math.floor(Math.random() * 4); state.stone += s; found.push(`石头 x${s}`); }
  if (Math.random() < 0.35) { const m = 1 + Math.floor(Math.random() * 2); state.metal += m; found.push(`金属 x${m}`); }
  log(`你走向远方……（第 ${state.explored} 次探索）`, "warn");
  log(found.length ? `你发现了：${found.join("、")}` : "除了风雪，什么也没有。", found.length ? "good" : "dim");
  render();
}

// ---------- 主循环 ----------
setInterval(() => {
  state.tick++;

  // 火堆消耗
  if (state.fireUnlocked) {
    state.fire = Math.max(0, state.fire - 0.4);
    if (state.fire <= 0 && state.tick % 30 === 0) {
      log("火堆快要灭了。", "warn");
    }
  }

  // 自动采集
  if (state.gatherJobs > 0 && state.tick % 20 === 0) {
    const add = state.gatherJobs;
    state.wood += add;
  }

  // 自动狩猎
  if (state.huntJobs > 0 && state.tick % 40 === 0) {
    state.meat += state.huntJobs;
    if (Math.random() < 0.5) state.fur += state.huntJobs;
  }

  // 人口耗食
  if (state.pop > 0 && state.tick % 60 === 0) {
    state.meat = Math.max(0, state.meat - state.pop);
    if (state.meat === 0) log("营地里有人在挨饿。", "warn");
  }

  render();
}, 1000);

// ---------- 存档 ----------
function snapshot() {
  return JSON.stringify({
    v: 1,
    data: { ...state, log: state.log.slice(-80) }
  });
}

function saveGame(quiet) {
  try {
    localStorage.setItem(SAVE_KEY, snapshot());
    if (!quiet) flash("已保存", "#5a8a5a");
  } catch (e) {
    flash("保存失败：" + e.message, "#a06a3a");
  }
}

function loadGame(quiet) {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) { flash("没有找到存档", "#a06a3a"); return; }
  try {
    const obj = JSON.parse(raw);
    Object.assign(state, obj.data);
    render();
    renderLog();
    if (!quiet) flash("已读取存档", "#5a8a5a");
  } catch (e) {
    flash("存档损坏", "#a06a3a");
  }
}

function exportSave() {
  const blob = new Blob([snapshot()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `yuanhan_save_${Date.now()}.json`;
  a.click();
}

function importSave() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = e => {
    const f = e.target.files[0];
    const r = new FileReader();
    r.onload = ev => {
      try {
        const obj = JSON.parse(ev.target.result);
        Object.assign(state, obj.data);
        render(); renderLog();
        flash("存档已导入", "#5a8a5a");
      } catch { flash("文件格式错误", "#a06a3a"); }
    };
    r.readAsText(f);
  };
  input.click();
}

function resetGame() {
  if (!confirm("确定要重新开始？当前进度将丢失。")) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

function flash(msg, color) {
  const el = document.getElementById("saveMsg");
  el.textContent = msg;
  el.style.color = color;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 2500);
}

// 自动存档
